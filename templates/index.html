<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dream Team Builder — Copa do Mundo 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <header class="app-header">
    <div class="header-left">
      <span class="eyebrow">DREAM TEAM BUILDER · 1950 — 2026</span>
      <h1>⚡ Monte sua seleção <span class="accent">dos sonhos</span></h1>
    </div>
    <div class="algo-badge">Knapsack 0/1 · 33 jogadores · <span id="capacidade-badge">250</span>M€</div>
  </header>

  <main class="app-grid">

    <section class="panel panel-left" id="painel-esquerdo">

      <div class="control-group">
        <span class="field-label">ORÇAMENTO</span>
        <div class="budget-value"><span id="orcamento-valor">250</span>M€</div>
        <input type="range" id="orcamento-slider" aria-label="Orçamento em milhões de euros" min="50" max="400" step="5" value="250">
      </div>

      <div class="control-group">
        <span class="field-label">FORMAÇÃO</span>
        <div class="formation-grid" id="formation-grid">
          <button class="formation-btn active" data-formacao="4-3-3">4-3-3</button>
          <button class="formation-btn" data-formacao="4-4-2">4-4-2</button>
          <button class="formation-btn" data-formacao="3-5-2">3-5-2</button>
        </div>
      </div>

      <div class="control-group">
        <span class="field-label">FILTRAR POR SELEÇÃO</span>
        <select id="selecao-filter" aria-label="Filtrar jogadores por seleção">
          <option value="">Todas as seleções</option>
          <option value="Brasil">🇧🇷 Brasil</option>
          <option value="Argentina">🇦🇷 Argentina</option>
          <option value="França">🇫🇷 França</option>
          <option value="Portugal">🇵🇹 Portugal</option>
          <option value="Bélgica">🇧🇪 Bélgica</option>
          <option value="Espanha">🇪🇸 Espanha</option>
          <option value="Inglaterra">🏴󠁧󠁢󠁥󠁮󠁧󠁿 Inglaterra</option>
          <option value="Alemanha">🇩🇪 Alemanha</option>
          <option value="Holanda">🇳🇱 Holanda</option>
          <option value="Croácia">🇭🇷 Croácia</option>
          <option value="Uruguai">🇺🇾 Uruguai</option>
          <option value="Noruega">🇳🇴 Noruega</option>
          <option value="Egito">🇪🇬 Egito</option>
          <option value="Itália">🇮🇹 Itália</option>
        </select>
      </div>

      <button id="btn-montar" class="btn-roll">⚡ MONTAR TIME IDEAL</button>

      <span class="field-label list-label">JOGADORES DISPONÍVEIS</span>
      <div class="players-list" id="players-list"></div>
    </section>

    <section class="panel panel-center" id="painel-central">
      <div class="field-topbar">
        <span id="formacao-atual-label">4-3-3</span>
        <span class="dot">·</span>
        <span>CLÁSSICO</span>
      </div>
      <div class="field-wrap" id="field-wrap">
        <svg class="field-svg" viewBox="0 0 100 140" preserveAspectRatio="none">
          <rect x="0" y="0" width="100" height="140" class="field-grass" />
          <rect x="2" y="2" width="96" height="136" class="field-line" />
          <line x1="2" y1="70" x2="98" y2="70" class="field-line" />
          <circle cx="50" cy="70" r="10" class="field-line" />
          <circle cx="50" cy="70" r="0.6" class="field-spot" />
          <!-- área e gol de baixo -->
          <rect x="22" y="114" width="56" height="22" class="field-line" />
          <rect x="38" y="130" width="24" height="6" class="field-line" />
          <circle cx="50" cy="118" r="0.6" class="field-spot" />
          <path d="M 38 114 A 12 12 0 0 1 62 114" class="field-line" />
          <!-- área e gol de cima -->
          <rect x="22" y="4" width="56" height="22" class="field-line" />
          <rect x="38" y="4" width="24" height="6" class="field-line" />
          <circle cx="50" cy="22" r="0.6" class="field-spot" />
          <path d="M 38 26 A 12 12 0 0 0 62 26" class="field-line" />
        </svg>

        <div class="field-slots" id="field-slots">
          <!-- slots dos 11 jogadores, posicionados via JS conforme a formação -->
        </div>
      </div>
    </section>

    <section class="panel panel-right" id="painel-direito">
      <div class="boxscore-header">
        <span class="field-label">BOX SCORE · <span id="boxscore-count">0/11</span></span>
      </div>

      <div class="overall-display">
        <span class="overall-number" id="overall-medio">0</span>
        <span class="overall-label">OVERALL MÉDIO</span>
      </div>

      <div class="budget-bar-wrap">
        <div class="budget-bar-labels">
          <span id="gasto-valor">0M€</span>
          <span id="orcamento-total-valor">/ 250M€</span>
        </div>
        <div class="budget-bar">
          <div class="budget-bar-fill" id="budget-bar-fill"></div>
        </div>
        <div class="budget-sobrou">Sobrou: <span id="sobrou-valor">0M€</span></div>
      </div>

      <div class="team-list" id="team-list"></div>

      <div class="action-buttons">
        <button id="btn-resetar" class="btn-outline">↺ RESETAR</button>
        <button id="btn-compartilhar" class="btn-outline">↗ COMPARTILHAR</button>
      </div>
    </section>

  </main>

  <footer class="app-footer">
    Powered by Knapsack 0/1 — Programação Dinâmica
  </footer>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
